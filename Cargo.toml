[package]
name = "Mezaleth"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sobhanmohammadi-dev/Mezaleth"
description = "Append-only, exclusively-locked, in-memory-indexed key-value store."

[lib]
name = "Mezaleth"
path = "src/lib.rs"

[features]
# Enables the `fuzz_support` module used by the targets under /fuzz.
# Not needed for normal builds or `cargo test`.
fuzzing = []

