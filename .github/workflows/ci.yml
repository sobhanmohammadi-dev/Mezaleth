name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings


  fuzz-build:
    name: Fuzz build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build


  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    needs: fuzz-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Fuzz v1
        working-directory: fuzz
        run: cargo +nightly fuzz run read_record_v1 -- -max_total_time=60

      - name: Fuzz v2
        working-directory: fuzz
        run: cargo +nightly fuzz run read_record_v2 -- -max_total_time=60

      - name: Fuzz recovery
        working-directory: fuzz
        run: cargo +nightly fuzz run full_recovery -- -max_total_time=60


  release:
    name: Release
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - check
      - fuzz-build
      - fuzz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify package
        run: cargo package --allow-dirty

      - name: Verify publish
        run: cargo publish --dry-run

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/package/*.crate

      # Uncomment this section after adding CARGO_REGISTRY_TOKEN
      # to the repository secrets.
      #
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish