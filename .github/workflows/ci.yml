name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

  pull_request:

# Least privilege by default.
# The release job overrides this with contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------
  # Stable checks
  # ------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings


  # ------------------------------------------------------------
  # Fuzz build
  # ------------------------------------------------------------
  fuzz-build:
    name: Fuzz build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Verify cargo-fuzz
        run: cargo fuzz --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build


  # ------------------------------------------------------------
  # Fuzz tests
  # ------------------------------------------------------------
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest

    needs:
      - fuzz-build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Verify cargo-fuzz
        run: cargo fuzz --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Fuzz read_record_v1
        working-directory: fuzz
        run: cargo +nightly fuzz run read_record_v1 -- -max_total_time=60

      - name: Fuzz read_record_v2
        working-directory: fuzz
        run: cargo +nightly fuzz run read_record_v2 -- -max_total_time=60

      - name: Fuzz full_recovery
        working-directory: fuzz
        run: cargo +nightly fuzz run full_recovery -- -max_total_time=60


  # ------------------------------------------------------------
  # Release
  # ------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - check
      - fuzz-build
      - fuzz

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify package
        run: cargo package --allow-dirty

      - name: Verify publish
        run: cargo publish --dry-run

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/package/*.crate

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish